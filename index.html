<style>/* ===========================================================
   CJA Consulting — Foundations (colors + type)
   Source of truth for colors_and_type used everywhere.

/* ---------- Type ----------------------------------------- */
/* Brand spec calls for Helvetica (Light / Regular / Bold).
   Real licensed font files are loaded from /fonts.
   Helvetica Neue is the preferred face; classic Helvetica is the fallback. */

@font-face { font-family: 'Helvetica Neue'; font-weight: 300; font-style: normal; src: url("assets/f176f3c3-f39c-4559-9ce4-ba0076f7f26b.otf") format('opentype'); font-display: swap; }
@font-face { font-family: 'Helvetica Neue'; font-weight: 400; font-style: normal; src: url("assets/50d4ba49-55b8-45dc-9a65-2975af5c03ae.otf")        format('opentype'); font-display: swap; }
@font-face { font-family: 'Helvetica Neue'; font-weight: 500; font-style: normal; src: url("assets/df1927e0-3992-4084-a865-1332ab43e05f.otf") format('opentype'); font-display: swap; }
@font-face { font-family: 'Helvetica Neue'; font-weight: 700; font-style: normal; src: url("assets/573f9ec0-f689-4008-bcf1-40bfe686cabc.otf")   format('opentype'); font-display: swap; }

@font-face { font-family: 'Helvetica';      font-weight: 300; font-style: normal; src: url("assets/0a9011f6-7af3-4bdd-87f3-7008e1165804.ttf") format('truetype'); font-display: swap; }
@font-face { font-family: 'Helvetica';      font-weight: 400; font-style: normal; src: url("assets/5e013b20-d533-4c9d-909f-7f5049e93e3e.ttf")       format('truetype'); font-display: swap; }
@font-face { font-family: 'Helvetica';      font-weight: 700; font-style: normal; src: url("assets/a7ffe4fa-1f21-45c0-8ba7-4a2f4239bfb2.ttf")  format('truetype'); font-display: swap; }

:root {
  /* ---------- Brand colors (from Color.pdf) ----------------- */
  /* Main */
  --cja-teal:        #37BFB7;   /* MAIN COLOR — primary brand */
  --cja-ink:         #0F1F35;   /* SECONDARY COLOR — deep navy/ink */

  /* Logo gradient stops (from Color [logo only].pdf) */
  --cja-teal-light:  #18CBBE;   /* gradient top */
  --cja-teal-deep:   #08877A;   /* gradient bottom */

  /* Palette — supporting colors */
  --cja-slate-blue:  #859CBC;
  --cja-cobalt:      #0F4C83;
  --cja-aqua:        #7AE4DA;
  --cja-amber:       #F7A302;

  --cja-peach:       #FDCF9B;
  --cja-petrol:      #007296;
  --cja-plum:        #705888;
  --cja-rust:        #AD4520;

  --cja-charcoal:    #2C373B;
  --cja-mist:        #EDF1FD;
  --cja-coral:       #F0A796;
  --cja-rose:        #ED476D;

  /* ---------- Neutrals (derived) ---------------------------- */
  --cja-white:       #FFFFFF;
  --cja-off-white:   #FAFBFC;
  --cja-paper:       #F4F6F9;     /* warmer surface */
  --cja-line:        #E3E8EF;
  --cja-line-strong: #C9D2DD;
  --cja-muted:       #6B7785;
  --cja-text-2:      #3D4856;
  --cja-text-1:      var(--cja-ink);
  --cja-black:       #0A1626;

  /* ---------- Semantic foreground / surface ----------------- */
  --fg-1: var(--cja-ink);          /* primary text */
  --fg-2: var(--cja-text-2);       /* body / secondary */
  --fg-3: var(--cja-muted);        /* labels / meta */
  --fg-on-dark:    var(--cja-white);
  --fg-on-teal:    var(--cja-white); /* white text on teal — per brand preference */

  --bg-1: var(--cja-white);        /* page */
  --bg-2: var(--cja-off-white);    /* subtle */
  --bg-3: var(--cja-paper);        /* card / well */
  --bg-mist: var(--cja-mist);      /* tinted section */
  --bg-ink: var(--cja-ink);        /* dark sections */
  --bg-charcoal: var(--cja-charcoal);

  --border-1: var(--cja-line);
  --border-2: var(--cja-line-strong);

  /* ---------- Semantic accent ------------------------------- */
  --accent:        var(--cja-teal);
  --accent-deep:   var(--cja-teal-deep);
  --accent-light:  var(--cja-aqua);
  --accent-hover:  #2EA8A1;        /* teal at hover */
  --accent-press:  #1E847E;        /* teal at press */

  /* Status (mapped to palette) */
  --success: var(--cja-petrol);
  --warning: var(--cja-amber);
  --danger:  var(--cja-rose);
  --info:    var(--cja-cobalt);

  /* ---------- Gradients ------------------------------------- */
  --gradient-mark:  linear-gradient(180deg, var(--cja-teal-light) 0%, var(--cja-teal-deep) 100%);
  --gradient-teal:  linear-gradient(135deg, var(--cja-teal-light) 0%, var(--cja-teal-deep) 100%);
  --gradient-ink:   linear-gradient(180deg, #122544 0%, #0A1626 100%);

  /* ---------- Radii ----------------------------------------- */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-xl: 16px;
  --radius-pill: 999px;

  /* ---------- Spacing (4-pt scale) -------------------------- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;
  --space-24: 96px;
  --space-32: 128px;

  /* ---------- Shadows / Elevation --------------------------- */
  /* Reserved, low-key. Brand is not a shadow-heavy brand. */
  --shadow-xs: 0 1px 2px rgba(15, 31, 53, 0.04);
  --shadow-sm: 0 2px 6px rgba(15, 31, 53, 0.06), 0 1px 2px rgba(15, 31, 53, 0.04);
  --shadow-md: 0 8px 20px rgba(15, 31, 53, 0.08), 0 2px 4px rgba(15, 31, 53, 0.04);
  --shadow-lg: 0 24px 48px rgba(15, 31, 53, 0.12), 0 4px 10px rgba(15, 31, 53, 0.06);
  --shadow-inset: inset 0 0 0 1px var(--border-1);
  --ring-focus: 0 0 0 3px rgba(55, 191, 183, 0.35);

  /* ---------- Typography ------------------------------------ */
  --font-sans: "Helvetica Neue", "Helvetica", "Arial", system-ui, sans-serif;
  --font-display: "Helvetica Neue", "Helvetica", "Arial", system-ui, sans-serif;
  --font-mono: "SF Mono", "JetBrains Mono", "Menlo", "Consolas", monospace;

  /* Weights — brand calls out Light / Regular / Bold */
  --w-light:    300;
  --w-regular:  400;
  --w-medium:   500;   /* used sparingly for UI */
  --w-bold:     700;

  /* Type scale (display-weighted, slightly tighter for the
     advisory/serious tone of the brand). */
  --fs-display-xl: 64px;
  --fs-display-l:  48px;
  --fs-display-m:  36px;
  --fs-h1:         32px;
  --fs-h2:         24px;
  --fs-h3:         20px;
  --fs-h4:         18px;
  --fs-body-l:     18px;
  --fs-body:       16px;
  --fs-body-s:     14px;
  --fs-caption:    13px;
  --fs-micro:      12px;

  --lh-tight:  1.1;
  --lh-snug:   1.2;
  --lh-normal: 1.4;
  --lh-body:   1.55;
  --lh-loose:  1.7;

  --ls-tight:  -0.02em;
  --ls-snug:   -0.01em;
  --ls-normal: 0;
  --ls-wide:   0.04em;
  --ls-eyebrow: 0.18em;   /* uppercase label / professional services advisory */
}

/* =========================================================
   Base + element styles (semantic, low specificity)
   ========================================================= */

html, body {
  font-family: var(--font-sans);
  color: var(--fg-1);
  background: var(--bg-1);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  font-weight: var(--w-regular);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-display);
  color: var(--fg-1);
  font-weight: var(--w-bold);
  letter-spacing: var(--ls-snug);
  line-height: var(--lh-snug);
  margin: 0;
  text-wrap: balance;
}

h1 { font-size: var(--fs-h1); letter-spacing: var(--ls-tight); }
h2 { font-size: var(--fs-h2); }
h3 { font-size: var(--fs-h3); }
h4 { font-size: var(--fs-h4); }

.display-xl { font-size: var(--fs-display-xl); font-weight: var(--w-bold); letter-spacing: var(--ls-tight); line-height: var(--lh-tight); }
.display-l  { font-size: var(--fs-display-l);  font-weight: var(--w-bold); letter-spacing: var(--ls-tight); line-height: var(--lh-tight); }
.display-m  { font-size: var(--fs-display-m);  font-weight: var(--w-bold); letter-spacing: var(--ls-snug);  line-height: var(--lh-snug);  }

p {
  margin: 0 0 var(--space-4) 0;
  color: var(--fg-2);
  text-wrap: pretty;
  max-width: 68ch;
}

a {
  color: var(--accent-deep);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color 120ms ease, color 120ms ease;
}
a:hover  { border-bottom-color: currentColor; }
a:focus-visible { outline: none; box-shadow: var(--ring-focus); border-radius: 2px; }

/* Eyebrow / overline — like "PROFESSIONAL SERVICES ADVISORY" in the logo */
.eyebrow {
  font-size: var(--fs-caption);
  font-weight: var(--w-bold);
  letter-spacing: var(--ls-eyebrow);
  text-transform: uppercase;
  color: var(--fg-3);
}

.lede {
  font-size: var(--fs-body-l);
  line-height: var(--lh-body);
  color: var(--fg-2);
  font-weight: var(--w-light);
  max-width: 60ch;
}

small, .meta {
  font-size: var(--fs-caption);
  color: var(--fg-3);
}

code, pre, kbd, samp {
  font-family: var(--font-mono);
  font-size: 0.95em;
}

hr {
  border: none;
  border-top: 1px solid var(--border-1);
  margin: var(--space-8) 0;
}

::selection {
  background: var(--cja-aqua);
  color: var(--cja-ink);
}
</style>
<style>/* ==========================================================
   CJA Consulting — Landing page (forked from design system)
   Extends colors_and_type.css for marketing-site layouts.
   ========================================================== */

* { box-sizing: border-box; }
body { margin: 0; }

/* Accent-intensity modes — applied at the artboard root */
.acc-subtle   { --acc: var(--cja-text-2); --acc-soft: var(--cja-line); }
.acc-standard { --acc: var(--cja-teal);   --acc-soft: rgba(55,191,183,0.12); }
.acc-bold     { --acc: var(--cja-teal-deep); --acc-soft: rgba(8,135,122,0.16); }

.container {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 32px;
}

.section { padding: 96px 0; }
.section-tight { padding: 64px 0; }
.section--ink { background: var(--cja-ink); color: var(--cja-white); }
.section--ink h1, .section--ink h2, .section--ink h3, .section--ink h4 { color: var(--cja-white); }
.section--ink p { color: rgba(255,255,255,0.78); }
.section--mist { background: var(--cja-mist); }
.section--paper { background: var(--cja-off-white); }

/* --- Site header ------------------------------------------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255,255,255,0.96);
  backdrop-filter: saturate(180%) blur(6px);
  -webkit-backdrop-filter: saturate(180%) blur(6px);
  border-bottom: 1px solid var(--border-1);
  height: 72px;
  display: flex;
  align-items: center;
}
.site-header .container { display: flex; align-items: center; justify-content: space-between; }
.site-header .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.site-header .brand img { height: 32px; display: block; }
.site-header nav { display: flex; gap: 28px; }
.site-header nav a {
  color: var(--fg-1);
  font-size: 14px;
  font-weight: 500;
  border: none;
  letter-spacing: 0.005em;
  cursor: pointer;
}
.site-header nav a:hover { color: var(--accent-deep); border: none; }
.site-header .cta { display: flex; gap: 12px; align-items: center; }

/* --- Buttons ----------------------------------------------- */
.btn {
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.005em;
  padding: 11px 20px;
  border-radius: 6px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 140ms cubic-bezier(0.2, 0.8, 0.2, 1);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  white-space: nowrap;
}
.btn:focus-visible { outline: none; box-shadow: var(--ring-focus); }

.btn-primary { background: var(--acc, var(--cja-teal)); color: var(--cja-white); }
.btn-primary:hover { filter: brightness(0.93); }
.btn-primary:active { filter: brightness(0.84); transform: translateY(1px); }

.btn-ghost { background: transparent; color: var(--cja-ink); border-color: var(--border-2); }
.btn-ghost:hover { border-color: var(--cja-ink); background: var(--bg-3); }

.btn-on-dark { background: var(--acc, var(--cja-teal)); color: var(--cja-white); }
.btn-on-dark.btn-ghost { background: transparent; color: var(--cja-white); border-color: rgba(255,255,255,0.3); }
.btn-on-dark.btn-ghost:hover { border-color: var(--cja-aqua); color: var(--cja-aqua); background: transparent; }

.btn-sm { font-size: 13px; padding: 8px 16px; }
.btn-lg { font-size: 15px; padding: 14px 26px; }
.btn .arrow { transition: transform 140ms ease; display: inline-block; }
.btn:hover .arrow { transform: translateX(3px); }

/* --- Eyebrow / dividers ------------------------------------ */
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--acc, var(--cja-teal-deep));
  margin-bottom: 20px;
}
.eyebrow::before {
  content: "";
  width: 32px;
  height: 1px;
  background: var(--acc, var(--cja-teal));
}
.eyebrow.no-rule::before { display: none; }
.section--ink .eyebrow { color: var(--cja-aqua); }
.section--ink .eyebrow::before { background: var(--cja-aqua); }

/* --- Headings ---------------------------------------------- */
.h-display {
  font-size: clamp(40px, 5vw, 64px);
  line-height: 1.05;
  letter-spacing: -0.022em;
  font-weight: 700;
  text-wrap: balance;
  margin: 0;
}
.h-display .accent { color: var(--acc, var(--cja-teal)); }
.h-section {
  font-size: clamp(28px, 3.4vw, 40px);
  line-height: 1.12;
  letter-spacing: -0.018em;
  font-weight: 700;
  text-wrap: balance;
  margin: 0;
}
.h-eyebrow-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* --- Hero ------------------------------------------------- */
.hero { padding: 88px 0 96px; position: relative; }

.hero--typographic .hero-grid {
  display: grid;
  grid-template-columns: 1.7fr 1fr;
  gap: 64px;
  align-items: center;
}
.hero--typographic .hero-mark {
  display: flex;
  justify-content: flex-end;
  align-items: center;
}
.hero--typographic .hero-mark img { width: 100%; max-width: 280px; display: block; }

.hero--split .hero-grid {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: 72px;
  align-items: center;
}
.hero--split .hero-portrait {
  position: relative;
  aspect-ratio: 4/5;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--shadow-md);
}
.hero--split .hero-portrait img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: contrast(1.02) saturate(0.92);
}
.hero--split .hero-portrait::after {
  content: "";
  position: absolute;
  inset: auto -16px -16px auto;
  width: 120px;
  height: 120px;
  background: var(--acc, var(--cja-teal));
  z-index: -1;
  border-radius: 14px;
}
.hero--split .portrait-wrap { position: relative; }

.hero--dark { background: var(--cja-ink); color: var(--cja-white); }
.hero--dark .hero-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 64px; align-items: center; }
.hero--dark .h-display { color: var(--cja-white); }
.hero--dark .h-display .accent { color: var(--cja-aqua); }
.hero--dark .lede { color: rgba(255,255,255,0.78); }
.hero--dark .eyebrow { color: var(--cja-aqua); }
.hero--dark .eyebrow::before { background: var(--cja-aqua); }
.hero--dark .hero-mark img { filter: drop-shadow(0 8px 24px rgba(8,135,122,0.4)); max-width: 260px; }
.hero--dark .meta-bar { color: rgba(255,255,255,0.5); border-color: rgba(255,255,255,0.12); }
.hero--dark .meta-bar strong { color: var(--cja-white); }

.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 36px; }

.meta-bar {
  margin-top: 56px;
  padding-top: 24px;
  border-top: 1px solid var(--border-1);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
  font-size: 13px;
  color: var(--fg-3);
}
.meta-bar > div { display: flex; flex-direction: column; gap: 4px; }
.meta-bar strong {
  color: var(--fg-1);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.005em;
}

/* --- Problem ----------------------------------------------- */
.problem-grid {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 64px;
  align-items: start;
}
.prob-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 32px;
}
.prob-list li {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  font-size: 15px;
  line-height: 1.5;
  color: var(--fg-2);
}
.prob-list .dot {
  flex: 0 0 6px;
  width: 6px;
  height: 6px;
  border-radius: 999px;
  background: var(--acc, var(--cja-teal));
  margin-top: 10px;
}

.problem-summary {
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--border-1);
  font-weight: 700;
  color: var(--cja-ink);
  font-size: 16px;
  max-width: none;
}

/* --- Approach --------------------------------------------- */
.approach-intro { max-width: 720px; margin-bottom: 56px; }
.approach-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}
.approach-step {
  background: var(--bg-1);
  border: 1px solid var(--border-1);
  border-radius: var(--radius-lg);
  padding: 24px;
  transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
}
.approach-step:hover {
  border-color: var(--border-2);
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
}
.approach-step .step-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
}
.step-n {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--acc, var(--cja-teal));
  letter-spacing: 0.1em;
}
.step-head svg { color: var(--cja-ink); width: 22px; height: 22px; }
.approach-step h3 { font-size: 16px; margin: 0 0 8px; line-height: 1.25; }
.approach-step p { font-size: 13px; line-height: 1.5; margin: 0; color: var(--fg-2); }

/* --- Services --------------------------------------------- */
.services-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 56px;
  flex-wrap: wrap;
  gap: 24px;
}
.offers-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.offer-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--radius-lg);
  padding: 28px;
  display: flex;
  flex-direction: column;
  transition: border-color 160ms ease, background 160ms ease;
}
.offer-card:hover {
  border-color: var(--cja-aqua);
  background: rgba(122,228,218,0.04);
}
.offer-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.offer-tag {
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--cja-aqua);
}
.offer-time {
  font-family: var(--font-mono);
  font-size: 11px;
  color: rgba(255,255,255,0.55);
}
.offer-card h3 { font-size: 19px; margin: 0 0 12px; line-height: 1.25; color: var(--cja-white); }
.offer-card p { font-size: 14px; line-height: 1.55; margin: 0 0 24px; flex: 1; }
.offer-link {
  color: var(--cja-aqua);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: none;
  cursor: pointer;
}
.offer-link .arrow { transition: transform 140ms ease; }
.offer-link:hover .arrow { transform: translateX(4px); }

/* --- ME inline strip -------------------------------------- */
